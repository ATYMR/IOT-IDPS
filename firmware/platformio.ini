; IoT IDPS sensor/response node - one codebase for ESP32 and ESP8266.
;
; Before the first build:  cp include/secrets.example.h include/secrets.h
; and fill in Wi-Fi, broker and the device key (python -m idps gen-key).
;
; Build:   pio run                      (all boards)
;          pio run -e esp32dev -t upload
; TLS:     PLATFORMIO_BUILD_FLAGS="-DIDPS_MQTT_USE_TLS=1" pio run

[platformio]
default_envs = esp32dev, nodemcuv2

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson @ 7.4.2
build_flags =
    -Wall
    -DARDUINOJSON_USE_LONG_LONG=1

[env:esp32dev]
platform = espressif32 @ 6.9.0          ; Arduino-ESP32 core 2.0.17
board = esp32dev

[env:nodemcuv2]
platform = espressif8266 @ 4.2.1        ; ESP8266 Arduino core 3.1.2
board = nodemcuv2
